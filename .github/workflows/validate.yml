name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --quiet python-docx

      - name: 脚本语法
        run: python -m compileall -q scripts tests

      - name: 冒烟测试
        run: python tests/test_smoke.py
